# Two targets. `dev` runs locally on DuckDB with no account.
# `bq` runs on BigQuery (sandbox tier works): set GCP_PROJECT and log in with
# `gcloud auth application-default login` first.
ab_test_dbt:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: ab_test.duckdb
      threads: 4
    bq:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT') }}"
      dataset: "{{ env_var('BQ_DATASET', 'ab_test_dbt') }}"
      location: US
      threads: 4
