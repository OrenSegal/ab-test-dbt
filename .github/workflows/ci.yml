name: dbt build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DBT_PROFILES_DIR: .
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Downloads the public CSV and fails if its SHA-256 is not the expected one.
      - run: ./scripts/fetch_data.sh
      - run: dbt build
      - run: python experiment/analyze.py
      # The committed readout must be what the code produces from the pinned data.
      - run: git diff --exit-code experiment/results.md
